# Weekly update pull requests for the SHA-pinned GitHub Actions, uv.lock and the pre-commit
# hooks. The cooldown skips releases younger than a week. GitHub raises no alerts for actions
# pinned to a SHA, so these pull requests are how action fixes arrive.
# The gitleaks CLI version in ci.yml is a plain download and is bumped by hand.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
