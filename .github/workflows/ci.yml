# Lint, type-check, test and scan for secrets on every push to main and every pull request.
# The unit tests need no API keys or network: LLM calls are mocked.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          docker build --target api -t filings-copilot-api:ci .
          docker build --target mcp -t filings-copilot-mcp:ci .
          docker build --target ui -t filings-copilot-ui:ci .

      # Built without the data bundle, the images hold no data, so check that they run as
      # a non-root user and that the code imports. The UI image must hold only the UI's
      # dependency group, and the Compose file must parse with the app profile on.
      - name: Check
        run: |
          for image in api mcp ui; do
            test "$(docker run --rm filings-copilot-$image:ci id -u)" != "0"
          done
          docker run --rm filings-copilot-api:ci python -c "import copilot.api.app, copilot.mcp.server"
          docker run --rm filings-copilot-ui:ci python -c "import streamlit, copilot.ui, copilot.api.client"
          docker run --rm filings-copilot-ui:ci python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('litellm', 'fastembed', 'langgraph')))"
          docker compose --profile app config --quiet
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep filings-copilot

      # Pinned and checksum-verified, like gitleaks. Fails on a critical vulnerability that
      # has a fix; lists the high ones. Bump both values together when upgrading.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy

      - name: Scan the images
        run: |
          for image in api ui; do
            "$RUNNER_TEMP/trivy" image --quiet --scanners vuln --ignore-unfixed \
              --severity HIGH,CRITICAL --exit-code 0 "filings-copilot-$image:ci"
            "$RUNNER_TEMP/trivy" image --quiet --scanners vuln --ignore-unfixed \
              --severity CRITICAL --exit-code 1 "filings-copilot-$image:ci"
          done

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive infra/terraform

      # Each root initialises without its backend, so the check needs no cloud access.
      - name: Validate each root
        run: |
          for root in infra/terraform/bootstrap infra/terraform/envs/prod; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned and checksum-verified. Bump both values together when upgrading.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # Scan the whole history on every run. It is cheap for this repository, and it also
      # covers a first push, whose commit range starts at the root commit.
      - name: Scan full git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose .
