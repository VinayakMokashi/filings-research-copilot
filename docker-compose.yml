# Local services. `uv run poe services-up` starts Qdrant and Postgres for development;
# `uv run poe stack-up` also builds and starts the copilot itself (the `app` profile): the
# API, the web UI and the MCP server over HTTP.
# Every port is bound to 127.0.0.1, so other machines can't reach these services;
# the credentials below are for local development only.
name: filings-copilot

x-copilot: &copilot
  profiles: [app]
  build:
    context: .
    target: api
  image: filings-copilot-api:local
  # The same settings as a local run: the model keys, and any FRC_ setting.
  env_file:
    - path: .env
      required: false
  volumes:
    # The facts database, parsed pages, models and caches; answers add to the caches and traces.
    - ./data:/app/data
  restart: unless-stopped

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl or wget, so ask /readyz over a raw bash TCP socket.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf ''GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3 && grep -q ''200 OK'' <&3'
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
      POSTGRES_DB: copilot
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ keeps data in a versioned directory under /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # -h forces a TCP probe: on first start the image's init server listens only on the
      # Unix socket, so a socket probe could report healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U copilot -d copilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *copilot
    environment:
      FRC_DATA_DIR: data
      FRC_QDRANT_URL: http://qdrant:6333
      FRC_DATABASE_URL: postgresql://copilot:${POSTGRES_PASSWORD:-copilot}@postgres:5432/copilot
      # Conversations, notes, feedback, quotas and the answer cache outlive the container.
      FRC_API_STATE: postgres
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  mcp:
    <<: *copilot
    command: ["python", "-m", "copilot.mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      FRC_DATA_DIR: data
      FRC_QDRANT_URL: http://qdrant:6333
      FRC_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${MCP_PORT:-8001}:8001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  ui:
    profiles: [app]
    build:
      context: .
      target: ui
    image: filings-copilot-ui:local
    environment:
      FRC_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
