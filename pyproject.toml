[project]
name = "filings-research-copilot"
version = "0.1.0"
description = "Agentic research copilot for public-company filings: cited answers from 10-K and 10-Q text and XBRL financial facts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vinayak Mokashi" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "litellm>=1.105.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pypdfium2>=5.14.0",
    "structlog>=26.1.0",
    "tokenizers>=0.23.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# ---------------------------------------------------------------------------
# Tasks: `uv run poe <task>` (works the same on Windows, macOS and Linux)
# ---------------------------------------------------------------------------
[tool.poe.tasks]
lint = { cmd = "ruff check .", help = "Lint with ruff" }
format = { cmd = "ruff format .", help = "Format with ruff" }
format-check = { cmd = "ruff format --check .", help = "Check formatting without changing files" }
typecheck = { cmd = "mypy", help = "Type-check src, tests and scripts" }
test = { cmd = "pytest", help = "Run the unit tests" }
check = { sequence = ["lint", "format-check", "typecheck", "test"], help = "Lint, format check, types and tests, as in CI" }
secrets = { cmd = "docker run --rm \"--mount=type=bind,source=${POE_ROOT},target=/repo\" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --verbose", help = "Scan the full git history for secrets, as CI does (needs Docker)" }
services-up = { cmd = "docker compose up -d --wait", help = "Start Qdrant and Postgres and wait until healthy" }
services-down = { cmd = "docker compose down", help = "Stop the local services (data volumes are kept)" }
models = { cmd = "python scripts/list_models.py", help = "List the models your Groq key can use" }
smoke = { cmd = "python scripts/smoke_llm.py", help = "One live call per model role through the gateway" }
fetch-financebench = { cmd = "python scripts/fetch_financebench.py", help = "Download FinanceBench and verify every file (--pdfs all for every PDF)" }
split-financebench = { cmd = "python scripts/split_financebench.py", help = "Make the FinanceBench dev/test split once, before any tuning" }
eval-retrieval = { cmd = "python scripts/eval_retrieval.py", help = "Score retrieval on FinanceBench evidence pages (--baseline first-pages or --predictions FILE)" }
compare-runs = { cmd = "python scripts/compare_runs.py", help = "Paired test of two eval runs on one metric" }
paraphrase-routing-seeds = { cmd = "python scripts/paraphrase_routing_seeds.py", help = "Ask the strong model for paraphrases of the routing seeds, for review" }
build-routing-set = { cmd = "python scripts/build_routing_set.py", help = "Build the routing eval set from seeds and reviewed paraphrases" }
eval-routing = { cmd = "python scripts/eval_routing.py", help = "Score a router on the routing set (--baseline keyword or --predictions FILE)" }
fetch-sec = { cmd = "python scripts/fetch_sec.py", help = "Match the companies to SEC filers and download their XBRL company facts" }
build-facts = { cmd = "python scripts/build_facts_db.py", help = "Build the SQLite facts database from the cached company facts" }
check-facts = { cmd = "python scripts/check_facts.py", help = "Cross-check the facts database against FinanceBench dev answers" }
build-sql-set = { cmd = "python scripts/build_sql_set.py", help = "Build the SQL eval set by running every gold query on the facts database" }
eval-sql = { cmd = "python scripts/eval_sql.py", help = "Score SQL predictions (--baseline gold or decline-all, or --predictions FILE)" }
spot-check-facts = { cmd = "python scripts/spot_check_facts.py", help = "Write a sheet of 20 random annual values to check by hand against the filings" }
parse-pdfs = { cmd = "python scripts/parse_pdfs.py", help = "Parse the FinanceBench PDFs into clean, section-tagged page text" }
check-pages = { cmd = "python scripts/check_page_alignment.py", help = "Check parsed pages line up with FinanceBench evidence pages (dev)" }
chunk-corpus = { cmd = "python scripts/chunk_corpus.py", help = "Chunk the parsed filings with one strategy (--strategy page, tokens-480 or tokens-256)" }

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["copilot"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

# Libraries without type information.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "-m", "not integration and not eval"]
markers = [
    "integration: needs Docker services or live API keys",
    "eval: runs an evaluation suite against real models",
]
filterwarnings = [
    # Raised inside LiteLLM's own type definitions; nothing in this project triggers it.
    "ignore:Item .* is using the `ReadOnly` qualifier:UserWarning",
]
