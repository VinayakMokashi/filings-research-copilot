[project]
name = "filings-research-copilot"
version = "0.1.0"
description = "Agentic research copilot for public-company filings: cited answers from 10-K and 10-Q text and XBRL financial facts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vinayak Mokashi" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "langfuse>=5.0.4",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "litellm>=1.105.1",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pypdfium2>=5.14.0",
    "qdrant-client>=1.19.1",
    "structlog>=26.1.0",
    "text2sql-analyst",
    "tokenizers>=0.23.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "poethepoet>=0.48.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
ui = [
    "streamlit>=1.66.1",
]

# ---------------------------------------------------------------------------
# Tasks: `uv run poe <task>` (works the same on Windows, macOS and Linux)
# ---------------------------------------------------------------------------
[tool.poe.tasks]
lint = { cmd = "ruff check .", help = "Lint with ruff" }
format = { cmd = "ruff format .", help = "Format with ruff" }
format-check = { cmd = "ruff format --check .", help = "Check formatting without changing files" }
typecheck = { cmd = "mypy", help = "Type-check src, tests and scripts" }
test = { cmd = "pytest", help = "Run the unit tests" }
check = { sequence = ["lint", "format-check", "typecheck", "test"], help = "Lint, format check, types and tests, as in CI" }
secrets = { cmd = "docker run --rm \"--mount=type=bind,source=${POE_ROOT},target=/repo\" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --verbose", help = "Scan the full git history for secrets, as CI does (needs Docker)" }
services-up = { cmd = "docker compose up -d --wait", help = "Start Qdrant and Postgres and wait until healthy" }
services-down = { cmd = "docker compose down", help = "Stop the local services (data volumes are kept)" }
stack-up = { cmd = "docker compose --profile app up -d --build --wait", help = "Build and start the whole stack in Docker: the services, the API on 127.0.0.1:8000, the web UI on 127.0.0.1:8501 and the MCP server at http://127.0.0.1:8001/mcp (API_PORT, UI_PORT and MCP_PORT move them)" }
stack-down = { cmd = "docker compose --profile app down", help = "Stop the whole stack (data volumes are kept)" }
models = { cmd = "python scripts/list_models.py", help = "List the models your Groq key can use" }
smoke = { cmd = "python scripts/smoke_llm.py", help = "One live call per model role through the gateway" }
fetch-financebench = { cmd = "python scripts/fetch_financebench.py", help = "Download FinanceBench and verify every file (--pdfs all for every PDF)" }
split-financebench = { cmd = "python scripts/split_financebench.py", help = "Make the FinanceBench dev/test split once, before any tuning" }
eval-retrieval = { cmd = "python scripts/eval_retrieval.py", help = "Score retrieval on FinanceBench evidence pages (--baseline first-pages or --predictions FILE)" }
compare-runs = { cmd = "python scripts/compare_runs.py", help = "Paired test of two eval runs on one metric" }
paraphrase-routing-seeds = { cmd = "python scripts/paraphrase_routing_seeds.py", help = "Ask the strong model for paraphrases of the routing seeds, for review" }
build-routing-set = { cmd = "python scripts/build_routing_set.py", help = "Build the routing eval set from seeds and reviewed paraphrases" }
eval-routing = { cmd = "python scripts/eval_routing.py", help = "Score a router on the routing set (--baseline keyword or --predictions FILE)" }
run-router = { cmd = "python scripts/run_router.py", help = "Run the semantic, LLM or cascade router on the routing set and score it, resumably (--router, --run)" }
api = { cmd = "uvicorn copilot.api.app:create_app --factory --host 127.0.0.1 --port 8000", help = "Serve the copilot's API on 127.0.0.1:8000, with its docs at /docs (needs Qdrant, the facts database and GROQ_API_KEY)" }
latency-report = { cmd = "python scripts/latency_report.py", help = "Median, 95th percentile and slowest run by route and node, with tokens and cost, from trace files (default data/traces/api.jsonl; no model calls)" }
mcp = { cmd = "python -m copilot.mcp", help = "Serve the copilot over MCP on stdio, as a desktop client launches it; --transport streamable-http serves it at http://127.0.0.1:8001/mcp (needs Qdrant and the facts database; ask_copilot needs the API)" }
ask = { cmd = "python scripts/ask.py", help ="Ask the copilot one question through its graph, with each step streamed (needs Qdrant and GROQ_API_KEY)" }
scan-injections = { cmd = "python scripts/scan_injections.py", help = "Count what the prompt-injection patterns flag in the parsed corpus (no model calls)" }
eval-semantic-cache = { cmd = "python scripts/eval_semantic_cache.py", help = "Measure a similarity cache on routing-set pairs: paraphrases against measure swaps (no model calls)" }
run-memory = { cmd = "python scripts/run_memory.py", help = "Run the memory set: follow-up rewriting and notes about users, turn by turn (--run)" }
run-copilot = { cmd = "python scripts/run_copilot.py", help = "Run FinanceBench dev questions through the copilot's graph, resumably, with agent metrics (--run)" }
fetch-sec = { cmd = "python scripts/fetch_sec.py", help = "Match the companies to SEC filers and download their XBRL company facts" }
build-facts = { cmd = "python scripts/build_facts_db.py", help = "Build the SQLite facts database from the cached company facts" }
check-facts = { cmd = "python scripts/check_facts.py", help = "Cross-check the facts database against FinanceBench dev answers" }
build-sql-set = { cmd = "python scripts/build_sql_set.py", help = "Build the SQL eval set by running every gold query on the facts database" }
eval-sql = { cmd = "python scripts/eval_sql.py", help = "Score SQL predictions (--baseline gold or decline-all, or --predictions FILE)" }
spot-check-facts = { cmd = "python scripts/spot_check_facts.py", help = "Write a sheet of 20 random annual values to check by hand against the filings" }
parse-pdfs = { cmd = "python scripts/parse_pdfs.py", help = "Parse the FinanceBench PDFs into clean, section-tagged page text" }
check-pages = { cmd = "python scripts/check_page_alignment.py", help = "Check parsed pages line up with FinanceBench evidence pages (dev)" }
chunk-corpus = { cmd = "python scripts/chunk_corpus.py", help = "Chunk the parsed filings with one strategy (--strategy page, tokens-480 or tokens-256)" }
index-corpus = { cmd = "python scripts/index_corpus.py", help = "Embed one chunking strategy into a Qdrant collection (--strategy, --model, --docs dev|all, --late)" }
check-hnsw = { cmd = "python scripts/check_hnsw.py", help = "Measure HNSW recall and latency against exact search on a copy of an index" }
run-retrieval = { cmd = "python scripts/run_retrieval.py", help = "Run and score one retrieval configuration on FinanceBench (--collection, --mode, --rerank, --setting)" }
compare-family = { cmd = "python scripts/compare_family.py", help = "Compare candidate runs with a baseline, Holm-adjusted across the family" }
generate-pairs = { cmd = "python scripts/generate_pairs.py", help = "Generate synthetic question-to-chunk pairs from training filings with the LLM" }
eval-context = { cmd = "python scripts/eval_context.py", help = "Measure how often the answer context holds an evidence page, by token budget" }
answer-questions = { cmd = "python scripts/answer_questions.py", help = "Answer FinanceBench dev questions with the doc agent, resumably (--limit N)" }
judge-answers = { cmd = "python scripts/judge_answers.py", help = "Judge a run's answers against the reference answers, resumably (--run NAME)" }
label-sample = { cmd = "python scripts/sample_labels.py", help = "Pick the answers to label as a reference for the judge, stratified by question type (--run NAME)" }
judge-agreement = { cmd = "python scripts/judge_agreement.py", help = "Agreement and Cohen's kappa between a judge and the reference labels" }
compare-judges = { cmd = "python scripts/compare_judges.py", help = "Agreement and Cohen's kappa between two judges on the same answers (--run, two judge names, --suite)" }
generate-routing-train = { cmd = "python scripts/generate_routing_train.py", help = "Write training questions for a classifier router and label them with the LLM router (--per-route)" }
kaggle-router = { cmd = "python scripts/kaggle_router.py", help = "Train the classifier router on a Kaggle GPU and download the model (--user, --ref, --name)" }
publish-router = { cmd = "python scripts/publish_router.py", help = "Publish a trained classifier router on Hugging Face as a public model (--model-dir, --repo; --dry-run)" }
kaggle-embedder = { cmd = "python scripts/kaggle_embedder.py", help = "Fine-tune the domain embedder on a Kaggle GPU from a private dataset, and download the model and the corpus's vectors (--user, --ref, --name; --prepare-only)" }
check-faithfulness = { cmd = "python scripts/check_faithfulness.py", help = "Check that each answer sentence is supported by the sources it cites (--run NAME)" }
ui = { cmd = "streamlit run src/copilot/ui/app.py --server.address 127.0.0.1 --server.port 8501 --browser.gatherUsageStats false --client.toolbarMode minimal", help = "Serve the web UI on 127.0.0.1:8501; it talks to the API at FRC_API_URL (default http://127.0.0.1:8000)" }
self-consistency = { cmd = "python scripts/self_consistency.py", help = "Sample more answers to a run's figure questions, vote on the figure, and keep a new run (--source, --k, --run)" }
validate-answers = { cmd = "python scripts/validate_answers.py", help = "Run the validator over a run's stored answers and keep the result as a new run, resumably (--source, --run)" }
analyse-errors = { cmd = "python scripts/analyse_errors.py", help = "Sort a run's answers into outcomes and error categories, with cost and latency" }
run-sql-agent = { cmd = "python scripts/run_sql_agent.py", help = "Answer the SQL set with the data agent and score it, resumably" }
ask-data = { cmd = "python scripts/ask_data.py", help = "Ask the data agent one question (needs GROQ_API_KEY)" }
answer-with-data = { cmd = "python scripts/answer_with_data.py", help = "Answer FinanceBench dev questions with the data agent, resumably (needs GROQ_API_KEY)" }
run-hybrid = { cmd = "python scripts/run_hybrid.py", help = "Answer the hybrid questions with the hybrid or the doc agent and check them (needs Qdrant and GROQ_API_KEY)" }

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["copilot"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

# Libraries without type information.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

# text2sql-analyst is annotated but ships no py.typed marker; read its annotations anyway.
[[tool.mypy.overrides]]
module = ["text2sql", "text2sql.*"]
follow_untyped_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "-m", "not integration and not eval"]
markers = [
    "integration: needs Docker services or live API keys",
    "eval: runs an evaluation suite against real models",
]
filterwarnings = [
    # Raised inside LiteLLM's own type definitions; nothing in this project triggers it.
    "ignore:Item .* is using the `ReadOnly` qualifier:UserWarning",
    # Tests use Qdrant's in-memory mode, which accepts payload indexes but doesn't need them.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]

[tool.uv.sources]
text2sql-analyst = { git = "https://github.com/VinayakMokashi/text2sql-analyst", rev = "bfaafdf7fdb212eef15a6e0c5bb4994d7ff38d7b" }

[tool.uv]
# FastEmbed caps Pillow below 13, but Pillow's security fixes landed in 13.0.0. Only
# FastEmbed's image models use Pillow, and this project runs its text models alone.
# LiteLLM caps filelock below 4, but the fix for its ReadWriteLock (GHSA-v4x8-3wr5-3wq8)
# landed in 4.2.1. LiteLLM takes file locks only in its proxy's command line, unused here.
override-dependencies = ["pillow>=13.0.0", "filelock>=4.2.1"]
# The UI's Streamlit is a group of its own, installed by default; an API image can leave it out
# with `uv sync --no-group ui`.
default-groups = ["dev", "ui"]
