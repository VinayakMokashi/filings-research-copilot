<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Paused · Filings Research Copilot</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --text: #31333f;
      --muted: #5c5f6b;
      --accent: #c81e1e;
      --on-accent: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0e1117;
        --text: #fafafa;
        --muted: #a3a8b8;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--text);
      font: 16px/1.6 "Source Sans Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 34rem; padding: 2rem 1rem; }
    .product { margin: 0; color: var(--muted); font-size: 0.9rem; }
    h1 { margin: 0.25rem 0 0.75rem; font-size: 2rem; line-height: 1.2; }
    p { margin: 0 0 1rem; }
    .note { color: var(--muted); }
    .continue {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 0.5rem;
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
      text-decoration: none;
    }
    .continue:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="product">Filings Research Copilot</p>
    <h1>Paused</h1>
    <p>This page paused after <span id="after">a while</span> without input, so that a tab
      left open doesn't keep a server running.</p>
    <p class="note">Continue to start again. A conversation in progress isn't kept.</p>
    <a class="continue" href="/">Continue</a>
  </main>
  <script>
    const minutes = Number(new URLSearchParams(location.search).get("after"));
    if (minutes > 0) {
      document.getElementById("after").textContent =
        minutes === 1 ? "a minute" : minutes + " minutes";
    }
  </script>
</body>
</html>
